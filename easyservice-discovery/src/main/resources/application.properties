spring.application.name=easyservice-discovery
server.port=8090
easyservice.backend.url=http://localhost:8080
discovery.browser.headless=true
discovery.browser.timeout-seconds=20
discovery.user-agent=EasyServiceDiscovery/1.0
easyservice.discovery.test-mode=true
easyservice.discovery.test-limit-per-category=5
easyservice.discovery.live-enabled=true
easyservice.discovery.http-timeout-ms=12000
