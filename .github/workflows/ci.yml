name: EasyService Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend for Selenium system tests
        working-directory: frontend
        run: npm run dev -- --host 0.0.0.0 > ../frontend-vite.log 2>&1 &

      - name: Wait for frontend
        run: npx --yes wait-on http://127.0.0.1:5173

      - name: Build with Maven & Run Unit/Integration Tests
        run: mvn clean test --file backend/pom.xml

      - name: Verify JaCoCo Coverage Threshold (>=80% Branch Coverage)
        run: mvn jacoco:check --file backend/pom.xml

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
